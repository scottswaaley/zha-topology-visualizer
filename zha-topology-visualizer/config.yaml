name: ZHA Network Topology Visualizer
version: "1.2.0"
slug: zha-topology-visualizer
description: Interactive visualization of your Zigbee mesh network topology with signal quality indicators
url: "https://github.com/scottswaaley/hass-zha-topology"
arch:
  - aarch64
  - amd64
  - armv7
  - i386
startup: application
boot: auto
init: false
webui: "http://[HOST]:[PORT:8099]"
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: Web interface
homeassistant_api: true
hassio_api: true
options:
  auto_refresh_minutes: 0
  use_zha_toolkit: true
  zha_toolkit_timeout: 300
  debug: false
schema:
  auto_refresh_minutes: int(0,1440)
  use_zha_toolkit: bool
  zha_toolkit_timeout: int(30,600)
  debug: bool
