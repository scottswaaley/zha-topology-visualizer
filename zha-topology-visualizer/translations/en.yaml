configuration:
  auto_refresh_minutes:
    name: Auto Refresh Interval
    description: >-
      Minutes between automatic data refreshes. Set to 0 to disable auto-refresh.
      The visualization will still update when you click the Refresh button.
      Recommended: 30-60 minutes for most networks.
  use_zha_toolkit:
    name: Active Scan (zha-toolkit)
    description: >-
      When enabled, each refresh actively queries every router for its live
      route and neighbour tables via the zha-toolkit integration, giving fresh,
      populated link LQIs instead of the coordinator's stale cached view.
      Requires the "zha-toolkit" custom integration (install via HACS). If it is
      not installed or the scan fails, the add-on falls back to cached data.
  zha_toolkit_timeout:
    name: Active Scan Timeout
    description: >-
      Maximum seconds to wait for the active zha-toolkit scan to finish. Larger
      networks with many routers need more time (raise toward 600 if scans time
      out). Default is 300 seconds.
